<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Envíos por Zona</title>
</head>
<body>

    <table border="1">

        <thead>
            <tr>
                <th colspan="2">
                    Control de Envíos por Zona
                </th>
            </tr>
        </thead>

        <tbody>

            <tr>
                <td>Dimensión</td>
                <td>
                    <select id="id-select-ejemplo">
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7" selected>7</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <button id="id-btn-cargar-ejemplo">
                        Cargar Ejemplo
                    </button>
                </td>
            </tr>

            <tr>
                <td>
                    <button id="id-btn-presentar-ejemplo">
                        Presentar
                    </button>
                </td>

                <td>
                    <textarea
                        id="id-listado-ejemplo"
                        rows="20"
                        cols="60"
                        readonly>
                    </textarea>
                </td>
            </tr>

        </tbody>

    </table>

    <script src="wz.js"></script>

</body>
</html>
